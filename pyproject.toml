[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "retrofetch"
version = "0.2.0"
description = "Retro GIF animations alongside Fastfetch in Kitty"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
retrofetch = "retrofetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
